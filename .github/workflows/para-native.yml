name: PARA native writes

on:
  pull_request:
    paths: ['src/**', 'tests/**', 'ui/**', 'lexicons/**', 'Cargo.*', 'para/**', '.github/workflows/para-native.yml']
  push:
    branches: [main, para/platform]
    paths: ['src/**', 'tests/**', 'ui/**', 'lexicons/**', 'Cargo.*', 'para/**', '.github/workflows/para-native.yml']

permissions:
  contents: read

concurrency:
  group: para-native-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: ''

jobs:
  native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: para-native
      - run: cargo fmt --check
      - run: cargo clippy --locked --lib --bin vlpds -- -D warnings
      - run: cargo test --locked --test all para::
      - run: cargo test --locked --test all crud::
      - run: cargo test --locked --test all app_passwords::
      - run: cargo test --locked --test all oauth::
      - run: cargo test --locked --test all passkeys::
      - run: cargo test --locked --test all import

  ui:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
