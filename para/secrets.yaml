# Los secretos de la plataforma, compartidos por compose.yaml y
# compose.worker.yaml.
#
# Un archivo por secreto en secrets/ (make secrets; PARA_SECRETS_DIR lo cambia,
# p. ej. a un tmpfs). Cada servicio declara los que usa y los recibe en
# /run/secrets/<nombre>; ver docs/CONFIGURACION.md.
secrets:
  postgres_password:
    file: ${PARA_SECRETS_DIR:-secrets}/postgres_password
  postgres_url:
    file: ${PARA_SECRETS_DIR:-secrets}/postgres_url
  postgres_url_bridge:
    file: ${PARA_SECRETS_DIR:-secrets}/postgres_url_bridge
  postgres_url_relay:
    file: ${PARA_SECRETS_DIR:-secrets}/postgres_url_relay
  s3_access_key_id:
    file: ${PARA_SECRETS_DIR:-secrets}/s3_access_key_id
  s3_secret_access_key:
    file: ${PARA_SECRETS_DIR:-secrets}/s3_secret_access_key
  vlpds_jwt_secret:
    file: ${PARA_SECRETS_DIR:-secrets}/vlpds_jwt_secret
  vlpds_admin_token:
    file: ${PARA_SECRETS_DIR:-secrets}/vlpds_admin_token
  vlpds_internal_token:
    file: ${PARA_SECRETS_DIR:-secrets}/vlpds_internal_token
  vlpds_kek:
    file: ${PARA_SECRETS_DIR:-secrets}/vlpds_kek
  vlpds_plc_rotation_key:
    file: ${PARA_SECRETS_DIR:-secrets}/vlpds_plc_rotation_key
  vlpds_rate_limit_bypass_key:
    file: ${PARA_SECRETS_DIR:-secrets}/vlpds_rate_limit_bypass_key
  relay_admin_password:
    file: ${PARA_SECRETS_DIR:-secrets}/relay_admin_password
  bsky_service_signing_key:
    file: ${PARA_SECRETS_DIR:-secrets}/bsky_service_signing_key
  bsky_admin_passwords:
    file: ${PARA_SECRETS_DIR:-secrets}/bsky_admin_passwords
  bsync_api_key:
    file: ${PARA_SECRETS_DIR:-secrets}/bsync_api_key
  ozone_signing_key:
    file: ${PARA_SECRETS_DIR:-secrets}/ozone_signing_key
  ozone_admin_password:
    file: ${PARA_SECRETS_DIR:-secrets}/ozone_admin_password
  authority_service_token:
    file: ${PARA_SECRETS_DIR:-secrets}/authority_service_token
  civic_delegation_resolver_secret:
    file: ${PARA_SECRETS_DIR:-secrets}/civic_delegation_resolver_secret
  m8_jwt_secret:
    file: ${PARA_SECRETS_DIR:-secrets}/m8_jwt_secret
  m8_app_key:
    file: ${PARA_SECRETS_DIR:-secrets}/m8_app_key
  m8_cookie_secret:
    file: ${PARA_SECRETS_DIR:-secrets}/m8_cookie_secret
  m8_curp_pepper:
    file: ${PARA_SECRETS_DIR:-secrets}/m8_curp_pepper
  m8_civic_vote_proof_secret:
    file: ${PARA_SECRETS_DIR:-secrets}/m8_civic_vote_proof_secret
  m8_issuer_private_jwk:
    file: ${PARA_SECRETS_DIR:-secrets}/m8_issuer_private_jwk
  m8_issuer_public_jwk:
    file: ${PARA_SECRETS_DIR:-secrets}/m8_issuer_public_jwk
  matrix_admin_token:
    file: ${PARA_SECRETS_DIR:-secrets}/matrix_admin_token
  matrix_appservice_token:
    file: ${PARA_SECRETS_DIR:-secrets}/matrix_appservice_token
  matrix_hs_token:
    file: ${PARA_SECRETS_DIR:-secrets}/matrix_hs_token
