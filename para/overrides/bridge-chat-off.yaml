# Se aplica sobre overrides/matrix.yaml cuando PROFILES no incluye matrix (el
# Makefile lo elige, ver PARA_BRIDGE_CHAT_OVERRIDE). El matrix-bridge corre en
# el perfil governance sin chat (MATRIX_CHAT_ENABLED=false): sigue sirviendo la
# constitución, los reportes y sanciones y el acceso verificado (que lee del
# AppView) desde el firehose y Postgres, sin Synapse, MAS, para-idp ni Element.
# Las propuestas y decisiones son cabildeos del AppView, no del bridge. Ver
# docs/MATRIX.md, "Sin chat".
services:
  matrix-bridge:
    depends_on: !override
      postgres:
        condition: service_healthy
      relay:
        condition: service_started
    environment:
      MATRIX_CHAT_ENABLED: 'false'
      # Sin homeserver no hay estos secretos (los crea make matrix-init).
      # Vacíos: env-from-files solo lee los que apuntan a /run/secrets/.
      MATRIX_ADMIN_TOKEN_FILE: ''
      MATRIX_APPSERVICE_TOKEN_FILE: ''
      MATRIX_HS_TOKEN_FILE: ''
      MATRIX_MAS_CLIENT_SECRET_FILE: ''
    secrets: !override
      - postgres_url_bridge
      - authority_service_token
