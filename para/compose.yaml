  s3_secret_access_key:
    file: ${PARA_SECRETS_DIR:-secrets}/s3_secret_access_key
  pds_jwt_secret:
    file: ${PARA_SECRETS_DIR:-secrets}/pds_jwt_secret
  pds_dpop_secret:
    file: ${PARA_SECRETS_DIR:-secrets}/pds_dpop_secret
  pds_admin_password:
