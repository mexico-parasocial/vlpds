---
# Base de cada máquina: paquetes, endurecimiento, reloj, Docker y red privada.

- name: Paquetes base
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - git
      - make
      - jq
      - ufw
      - fail2ban
      - chrony
      - unattended-upgrades
      - python3-debian
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Zona horaria UTC
  community.general.timezone:
    name: UTC

# Los leases, los certificados y las métricas dependen de un reloj sano
# (ParaHostClockSkew en ops/alerts.yml).
- name: Chrony activo
  ansible.builtin.service:
    name: chrony
    state: started
    enabled: true

# Parches de seguridad sin reinicios automáticos: reiniciar es decisión del
# operador.
- name: Actualizaciones de seguridad automáticas
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    mode: "0644"

- name: Sin reinicio automático tras actualizar
  ansible.builtin.lineinfile:
    path: /etc/apt/apt.conf.d/50unattended-upgrades
    regexp: '^//?\s*Unattended-Upgrade::Automatic-Reboot '
    line: 'Unattended-Upgrade::Automatic-Reboot "false";'
    create: true
    mode: "0644"

- name: Configurar fail2ban
  ansible.builtin.template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.local
    mode: "0644"
  notify: Restart fail2ban

- name: Fail2ban activo
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true

# --- Docker -------------------------------------------------------------------

- name: Directorio de llaveros de apt
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Llave del repositorio de Docker
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Repositorio de Docker
  ansible.builtin.deb822_repository:
    name: docker
    types: [deb]
    uris: https://download.docker.com/linux/ubuntu
    suites: "{{ ansible_distribution_release }}"
    components: [stable]
    architectures: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"
    signed_by: /etc/apt/keyrings/docker.asc

- name: Docker Engine y Compose
  ansible.builtin.apt:
    name: "{{ ['docker-ce', 'docker-ce-cli', 'containerd.io', 'docker-buildx-plugin', 'docker-compose-plugin']
              | map('regex_replace', '^(docker-ce|docker-ce-cli)$', '\\1' ~ (('=' ~ common_docker_apt_version) if common_docker_apt_version else ''))
              | list }}"
    state: present
    update_cache: true

- name: Docker activo
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

# Logs de contenedores con tope: un servicio ruidoso no llena el disco.
- name: Rotación de logs de Docker
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: |
      {"log-driver": "json-file", "log-opts": {"max-size": "50m", "max-file": "5"}}
    mode: "0644"
  register: common_docker_daemon

- name: Reiniciar Docker si cambió su configuración
  ansible.builtin.service:
    name: docker
    state: restarted
  when: common_docker_daemon is changed

# --- red privada --------------------------------------------------------------

- name: Tailscale
  when: common_tailscale_authkey | length > 0
  block:
    - name: Instalar Tailscale
      ansible.builtin.shell: curl -fsSL https://tailscale.com/install.sh | sh
      args:
        creates: /usr/bin/tailscale

    - name: Unirse a la red privada
      ansible.builtin.command: >-
        tailscale up --authkey={{ common_tailscale_authkey }}
        --advertise-tags={{ common_tailscale_tags }} --hostname={{ inventory_hostname }}
      register: common_tailscale_up
      changed_when: common_tailscale_up.rc == 0
      failed_when: common_tailscale_up.rc != 0 and 'already' not in common_tailscale_up.stderr
      no_log: true

    - name: Permitir todo en tailscale0
      community.general.ufw:
        rule: allow
        interface: tailscale0
        direction: in

# --- firewall -----------------------------------------------------------------

- name: Puertos públicos
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: "{{ common_public_tcp_ports }}"

- name: Firewall activo, todo lo demás cerrado
  community.general.ufw:
    state: enabled
    policy: deny
