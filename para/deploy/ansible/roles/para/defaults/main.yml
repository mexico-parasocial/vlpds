---
# Dónde vive la plataforma en la máquina.
para_root: /opt/para

# Los tres repos, cada uno fijado a una revisión (tag o commit). Las imágenes
# se descargan ya construidas (WATZAPPA_VERSION/MUBEZ_VERSION en para_env);
# de los repos solo se usan los compose y la configuración.
para_repos:
  # para-platform todavía no tiene remoto: pon su URL en el inventario.
  para-platform: {url: "", version: main}
  WatZappa: {url: "https://github.com/mexico-parasocial/WatZappa.git", version: main}
  mubEZ: {url: "git@github.com:mexico-parasocial/mubEZ.git", version: main}

# Llave de despliegue (solo lectura) para clonar repos privados. Va cifrada
# en el inventario (sops). Vacía = los repos son públicos o ya hay acceso.
para_git_deploy_key: ""

# Todo lo de para-platform/.env (ver .env.example). PARA_DOMAIN, el bucket y
# las versiones son obligatorios.
para_env: {}

# Un valor por archivo de secrets/ (scripts/secrets.sh list). Cifrado con sops.
para_secrets: {}

# env/identity.env y env/core.env (opcionales, no secretos).
para_identity_env: {}
para_core_env: {}

para_secrets_gid: 10001

# make preflight antes de levantar (bucket, secretos, DNS). Apagarlo solo para
# depurar.
para_preflight: true

# Worker de AppView: lo decide el grupo del inventario.
para_role: "{{ 'appview-worker' if 'para_appview' in group_names else 'primary' }}"
# IP privada de la principal, para los workers (Postgres y bsync).
para_primary_ip: "{{ hostvars[groups['para'][0]].para_private_ip | default('') }}"
